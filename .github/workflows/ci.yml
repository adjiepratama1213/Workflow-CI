name: Titanic_Model_CI
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build, Run, and Push Docker
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 pandas==2.0.3 scikit-learn==1.3.2
          
      - name: Run mlflow project
        run: |
          cd MLProject
          mlflow run . --env-manager=local
          
      - name: Find model path
        id: find_model
        run: |
          cd MLProject
          MODEL_PATH=$(find mlruns -path "*/artifacts/model/MLmodel" -print -quit | sed 's|/MLmodel$||')
          echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV
          echo "Model found at: $MODEL_PATH"

      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns/
          
      - name: Build Docker Model
        run: |
          cd MLProject
          mlflow models build-docker -m "${{ env.MODEL_PATH }}" -n ${{ secrets.DOCKER_USERNAME }}/titanic-model:latest --env-manager local
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/titanic-model:latest
